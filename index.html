<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Max | Mascota NFC</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: #252047;

            background: linear-gradient(
                145deg,
                #f52f8a 0%,
                #f52f8a 38%,
                #ff7a24 38%,
                #ff7a24 70%,
                #6d18a8 70%,
                #6d18a8 100%
            );

            padding: 25px 15px 40px;
        }

        .pagina {
            width: 100%;
            max-width: 520px;
            margin: auto;
        }

        /* FOTO DE LA MASCOTA */

        .foto-contenedor {
            width: 310px;
            height: 310px;
            margin: 0 auto 20px;

            border-radius: 50%;
            background: white;
            padding: 9px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .foto-mascota {
            width: 100%;
            height: 100%;

            object-fit: cover;
            border-radius: 50%;

            display: block;
        }

        /* MENSAJE */

        .mensaje-busqueda {
            background: white;
            border-radius: 30px;

            padding: 22px 15px;

            text-align: center;
            font-size: 24px;

            margin-bottom: 25px;

            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .mensaje-busqueda strong {
            color: #e52c85;
        }

        /* TARJETA PRINCIPAL */

        .tarjeta {
            background: white;

            border-radius: 35px;

            padding: 35px 25px 30px;

            box-shadow: 0 12px 30px rgba(0,0,0,0.20);
        }

        /* NOMBRE */

        .nombre {
            text-align: center;

            font-size: 58px;
            font-weight: 900;

            color: #d9257e;

            margin-bottom: 25px;
        }

        /* AUDIO */

        .titulo-audio {
            text-align: center;

            font-size: 27px;
            font-weight: bold;

            color: #d9257e;

            margin-bottom: 15px;
        }

        .audio-contenedor {
            background: #f32988;

            border-radius: 30px;

            padding: 20px;

            margin-bottom: 25px;
        }

        audio {
            width: 100%;
            height: 55px;

            display: block;
        }

        /* BOTONES */

        .boton {
            width: 100%;

            border: none;
            border-radius: 25px;

            padding: 18px 15px;

            margin-bottom: 20px;

            min-height: 90px;

            font-size: 24px;
            font-weight: bold;

            color: white;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 15px;

            box-shadow: 0 7px 15px rgba(0,0,0,0.18);

            transition: transform 0.15s, opacity 0.15s;
        }

        .boton:active {
            transform: scale(0.97);
        }

        .boton:hover {
            opacity: 0.92;
        }

        .icono {
            width: 60px;
            height: 60px;

            min-width: 60px;

            border-radius: 50%;

            background: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 34px;
        }

        /* LLAMAR */

        .boton-llamar {
            background: #ff7a18;
        }

        /* WHATSAPP */

        .boton-whatsapp {
            background: #20c765;
        }

        /* MENSAJE FINAL */

        .mensaje-final {
            background: white;

            border-radius: 35px;

            margin-top: 25px;

            padding: 35px 25px;

            text-align: center;

            font-size: 23px;

            line-height: 1.4;

            box-shadow: 0 10px 25px rgba(0,0,0,0.18);
        }

        .mensaje-final .pin {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .gracias {
            font-weight: 900;

            margin-top: 25px;

            font-size: 25px;
        }

        /* RESPONSIVE */

        @media (max-width: 400px) {

            body {
                padding: 15px 10px 30px;
            }

            .foto-contenedor {
                width: 270px;
                height: 270px;
            }

            .tarjeta {
                padding: 28px 18px 25px;
            }

            .nombre {
                font-size: 48px;
            }

            .titulo-audio {
                font-size: 22px;
            }

            .boton {
                font-size: 20px;
                min-height: 80px;
            }

            .icono {
                width: 52px;
                height: 52px;

                min-width: 52px;

                font-size: 28px;
            }
        }

    </style>
</head>

<body>

<div class="pagina">

    <!-- FOTO DE LA MASCOTA -->
    <div class="foto-contenedor">
        <img
            class="foto-mascota"
            src="https://i.imgur.com/placeholder.jpg"
            alt="Max"
        >
    </div>

    <!-- MENSAJE -->
    <div class="mensaje-busqueda">
        Mi familia está
        <strong>buscándome.</strong>
    </div>

    <!-- TARJETA PRINCIPAL -->
    <div class="tarjeta">

        <!-- NOMBRE -->
        <div class="nombre">
            MAX
        </div>

        <!-- AUDIO -->
        <div class="titulo-audio">
            📢 ESCUCHA MI MENSAJE
        </div>

        <div class="audio-contenedor">
            <audio controls>
                <source
                    src="max.mp3"
                    type="audio/mpeg"
                >
                Tu navegador no soporta audio.
            </audio>
        </div>

        <!-- BOTÓN LLAMAR -->
        <button
            class="boton boton-llamar"
            onclick="llamarFamilia()"
        >
            <span class="icono">📞</span>
            LLAMAR A MI FAMILIA
        </button>

        <!-- BOTÓN WHATSAPP -->
        <button
            class="boton boton-whatsapp"
            onclick="abrirWhatsApp()"
        >
            <span class="icono">💬</span>
            WHATSAPP
        </button>

    </div>

    <!-- MENSAJE FINAL -->
    <div class="mensaje-final">

        <div class="pin">🐾</div>

        Si me viste, por favor
        comunícate con mi familia.

        <div class="gracias">
            ¡TE LO AGRADECERÉ MUCHO! ❤️
        </div>

    </div>

</div>

<script>

    /* ================================
       CONFIGURACIÓN
       ================================ */

    /* CAMBIA ESTE NÚMERO */
    const TELEFONO_FAMILIA =
        "+51901940230";


    /* CAMBIA ESTE NÚMERO */
    const WHATSAPP_FAMILIA =
        "51901640230";


    /* ================================
       LLAMAR
       ================================ */

    function llamarFamilia() {

        window.location.href =
            "tel:" +
            TELEFONO_FAMILIA;

    }


    /* ================================
       WHATSAPP
       ================================ */

    function abrirWhatsApp() {

        const mensaje =
            "Hola, encontré a Max y quiero comunicarme con su familia.";

        const url =
            "https://wa.me/" +
            WHATSAPP_FAMILIA +
            "?text=" +
            encodeURIComponent(mensaje);

        window.open(
            url,
            "_blank"
        );

    }

</script>

</body>
</html>
